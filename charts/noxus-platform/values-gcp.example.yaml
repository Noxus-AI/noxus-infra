# GKE example. Pair with terraform/stacks/kubernetes/gcp-gke.
#
# Assumes: GKE Ingress (gce) with a Google-managed certificate, Workload Identity
# enabled, and a GSA bound to the chart's ServiceAccount for GCS access.

appVersion: "0.8.1"

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: noxus-prod-pods@my-project.iam.gserviceaccount.com

env:
  ADMIN_EMAIL: admin@example.com
  DEPLOYMENT_ENV: prod
  IS_PROD: "true"

  FRONTEND_URL: https://noxus.example.com
  BACKEND_URL: https://api.noxus.example.com
  RELAY_URL: https://relay.noxus.example.com

  BUCKET_CLIENT: gcloud
  SPOTFLOW_STORAGE_BUCKET: noxus-prod-artifacts
  SPOTFLOW_PUBLIC_STORAGE_BUCKET: noxus-prod-artifacts-public

  # Vertex AI as the model provider; the Workload Identity binding above must
  # carry roles/aiplatform.user.
  VERTEX_PROJECT_ID: my-project
  FIRESTORE_PROJECT: my-project

secrets:
  POSTGRESQL_URL: "noxus:CHANGEME@10.20.0.3:5432"
  VECTOR_POSTGRESQL_URL: "noxus:CHANGEME@10.20.0.3:5432"
  REDIS_URL: "10.30.0.4"

  AUTH0_DOMAIN: tenant.eu.auth0.com
  AUTH0_ISSUER_BASE_URL: https://tenant.eu.auth0.com
  AUTH0_BASE_URL: https://noxus.example.com
  AUTH0_API_AUDIENCE: https://api.noxus.example.com
  AUTH0_CLIENT_ID: CHANGEME
  AUTH0_CLIENT_SECRET: CHANGEME
  AUTH0_SECRET: CHANGEME

ingress:
  enabled: true
  className: gce
  domain: noxus.example.com
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: noxus-prod-ip
    # Create a ManagedCertificate covering the apex, api., and relay. hostnames
    # and reference it here.
    networking.gke.io/managed-certificates: noxus-prod-cert

pgbouncer:
  enabled: true
  postgresqlUrlSecret:
    name: noxus-upstream-postgres

backend:
  replicaCount: 2

frontend:
  replicaCount: 2

worker:
  keda:
    existingPostgresSecret: noxus-keda-postgres
  pools:
    default:
      enabled: true
      workerSubscribe: all_but_kb
      autoscaling:
        enabled: true
        type: keda
        minReplicas: 1
        maxReplicas: 15

sandbox:
  enabled: true
  # GKE Autopilot rejects SYS_PTRACE; use the weaker chroot jail there. On
  # Standard node pools leave this as "syd".
  jail: syd
