# AKS example. Pair with terraform/stacks/kubernetes/azure-aks.
#
# Assumes: ingress-nginx + cert-manager installed, Workload Identity enabled, and a
# user-assigned managed identity federated to the chart's ServiceAccount for Blob
# Storage access.

appVersion: "0.8.1"

serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000

env:
  ADMIN_EMAIL: admin@example.com
  DEPLOYMENT_ENV: prod
  IS_PROD: "true"

  FRONTEND_URL: https://noxus.example.com
  BACKEND_URL: https://api.noxus.example.com
  RELAY_URL: https://relay.noxus.example.com

  # Azure Blob is consumed through its S3-compatible path; point S3_ENDPOINT_URL at
  # the storage account and treat the access key as the S3 secret pair.
  BUCKET_CLIENT: s3
  S3_ENDPOINT_URL: https://noxusprod.blob.core.windows.net
  SPOTFLOW_STORAGE_BUCKET: artifacts
  SPOTFLOW_PUBLIC_STORAGE_BUCKET: artifacts-public

secrets:
  POSTGRESQL_URL: "noxus:CHANGEME@noxus-prod.postgres.database.azure.com:5432"
  VECTOR_POSTGRESQL_URL: "noxus:CHANGEME@noxus-prod.postgres.database.azure.com:5432"
  REDIS_URL: "noxus-prod.redis.cache.windows.net"
  REDIS_PASSWORD: CHANGEME

  S3_ACCESS_KEY_ID: noxusprod
  S3_SECRET_ACCESS_KEY: CHANGEME

  AUTH0_DOMAIN: tenant.eu.auth0.com
  AUTH0_ISSUER_BASE_URL: https://tenant.eu.auth0.com
  AUTH0_BASE_URL: https://noxus.example.com
  AUTH0_API_AUDIENCE: https://api.noxus.example.com
  AUTH0_CLIENT_ID: CHANGEME
  AUTH0_CLIENT_SECRET: CHANGEME
  AUTH0_SECRET: CHANGEME

# Azure Cache for Redis enforces TLS and serves it on 6380, not the 6379 default.
extraEnv:
  REDIS_PORT: "6380"
  REDIS_SSL: "true"

ingress:
  enabled: true
  className: nginx
  domain: noxus.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: noxus-tls
      hosts:
        - noxus.example.com
        - api.noxus.example.com
        - relay.noxus.example.com

pgbouncer:
  enabled: true
  postgresqlUrlSecret:
    name: noxus-upstream-postgres

backend:
  replicaCount: 2

frontend:
  replicaCount: 2

worker:
  keda:
    existingPostgresSecret: noxus-keda-postgres
  pools:
    default:
      enabled: true
      workerSubscribe: all_but_kb
      autoscaling:
        enabled: true
        type: keda
        minReplicas: 1
        maxReplicas: 15

sandbox:
  enabled: true
