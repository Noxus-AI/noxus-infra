# AKS example. Pair with terraform/stacks/kubernetes/azure-aks.
#
# Assumes: ingress-nginx + cert-manager installed, and the platform images
# reachable — either mirrored into an ACR the kubelet identity can pull from
# (set global.imageRegistry) or pulled from Docker Hub with an imagePullSecret.

appVersion: "0.8.1"

serviceAccount:
  create: true

# Mirror of the platform images. Leave empty to pull noxusai/noxus-np straight
# from Docker Hub, which will not survive a scale-out.
global:
  imageRegistry: "noxusprodacr.azurecr.io"
  imagePullSecrets: []

env:
  ADMIN_EMAIL: admin@example.com
  DEPLOYMENT_ENV: prod
  IS_PROD: "true"

  FRONTEND_URL: https://noxus.example.com
  BACKEND_URL: https://api.noxus.example.com
  RELAY_URL: https://relay.noxus.example.com

  # Blob Storage exposes no S3 API, so use the platform's native Azure client.
  # Both bucket vars are the storage ACCOUNT name, not container names: the
  # client builds https://<account>.blob.core.windows.net and writes into a
  # fixed "noxus" container.
  BUCKET_CLIENT: azure
  SPOTFLOW_STORAGE_BUCKET: noxusprod
  SPOTFLOW_PUBLIC_STORAGE_BUCKET: noxusprod

secrets:
  POSTGRESQL_URL: "noxus:CHANGEME@noxus-prod.postgres.database.azure.com:5432"
  VECTOR_POSTGRESQL_URL: "noxus:CHANGEME@noxus-prod.postgres.database.azure.com:5432"
  REDIS_URL: "noxus-prod.redis.cache.windows.net"
  REDIS_PASSWORD: CHANGEME

  AZURE_STORAGE_ACCOUNT_KEY: CHANGEME

  AUTH0_DOMAIN: tenant.eu.auth0.com
  AUTH0_ISSUER_BASE_URL: https://tenant.eu.auth0.com
  AUTH0_BASE_URL: https://noxus.example.com
  AUTH0_API_AUDIENCE: https://api.noxus.example.com
  AUTH0_CLIENT_ID: CHANGEME
  AUTH0_CLIENT_SECRET: CHANGEME
  AUTH0_SECRET: CHANGEME

# Azure Cache for Redis enforces TLS and serves it on 6380, not the 6379 default.
extraEnv:
  REDIS_PORT: "6380"
  REDIS_SSL: "true"

ingress:
  enabled: true
  className: nginx
  domain: noxus.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: noxus-tls
      hosts:
        - noxus.example.com
        - api.noxus.example.com
        - relay.noxus.example.com

pgbouncer:
  enabled: true
  postgresqlUrlSecret:
    name: noxus-upstream-postgres

backend:
  replicaCount: 2

frontend:
  replicaCount: 2

worker:
  keda:
    existingPostgresSecret: noxus-keda-postgres
  pools:
    default:
      enabled: true
      workerSubscribe: all_but_kb
      autoscaling:
        enabled: true
        type: keda
        minReplicas: 1
        maxReplicas: 15

sandbox:
  enabled: true
