{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "noxus-platform.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "noxus-platform.labels" . | nindent 4 }}
    app: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: backend
      noxus.ai/region: primary
  template:
    metadata:
      labels:
        app: backend
        noxus.ai/region: primary
        {{- include "noxus-platform.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "noxus-platform.secretChecksum" . | nindent 8 }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "noxus-platform.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      containers:
        - name: backend
          image: {{ include "noxus-platform.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.backend.image.repository "tag" (default (printf "spotflow-backend-%s" .Values.appVersion) .Values.backend.image.tag)) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "noxus-platform.appEnvSecret" . }}
          {{- if .Values.sandbox.enabled }}
          env:
            # The backend talks to the agentsandbox manager directly from
            # the assistant shell websocket endpoint, so it needs the same
            # SANDBOX_MANAGER_URL the worker pools have.
            - name: SANDBOX_MANAGER_URL
              value: "http://{{ include "noxus-platform.fullname" . }}-sandbox:{{ .Values.sandbox.service.port }}"
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- with .Values.backend.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
