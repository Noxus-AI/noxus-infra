{{- if .Values.backend.enabled }}
{{- $fullName := include "noxus-platform.fullname" . }}
{{- $labels := include "noxus-platform.labels" . }}
{{- $selectorLabels := include "noxus-platform.selectorLabels" . }}
{{- $secretChecksum := include "noxus-platform.secretChecksum" . }}
{{- $saName := include "noxus-platform.serviceAccountName" . }}
{{- $global := .Values.global }}
{{- $backend := .Values.backend }}
{{- $appVersion := .Values.appVersion }}
{{- range $regionName, $region := .Values.backend.regions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-backend-{{ $regionName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
    app: backend
    noxus.ai/region: {{ $regionName }}
spec:
  {{- $autoEnabled := default false (dig "autoscaling" "enabled" false $region) }}
  {{- if not $autoEnabled }}
  replicas: {{ $region.replicaCount | default $backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: backend
      noxus.ai/region: {{ $regionName }}
  template:
    metadata:
      labels:
        app: backend
        noxus.ai/region: {{ $regionName }}
        {{- $selectorLabels | nindent 8 }}
      annotations:
        {{- $secretChecksum | nindent 8 }}
        {{- with $backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $saName }}
      {{- with $global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $backend.affinity $region.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $backend.topologySpreadConstraints $region.topologySpreadConstraints) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $backend.nodeSelector $region.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $backend.tolerations $region.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $backend.terminationGracePeriodSeconds }}
      containers:
        - name: backend
          image: {{ include "noxus-platform.image" (dict "registry" $global.imageRegistry "repository" $backend.image.repository "tag" (default (printf "spotflow-backend-%s" $appVersion) $backend.image.tag)) }}
          imagePullPolicy: {{ $backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $backend.service.targetPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ $fullName }}-app-env
          resources:
            {{- toYaml (default $backend.resources $region.resources) | nindent 12 }}
          {{- with $backend.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $backend.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $backend.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
{{- if (default false (dig "autoscaling" "enabled" false $region)) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullName }}-backend-{{ $regionName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
    app: backend
    noxus.ai/region: {{ $regionName }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullName }}-backend-{{ $regionName }}
  minReplicas: {{ $region.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ $region.autoscaling.maxReplicas | default 5 }}
  metrics:
    {{- if $region.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $region.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $region.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $region.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
