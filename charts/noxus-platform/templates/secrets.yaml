{{- $config := merge (default dict .Values.extraEnv) .Values.env }}
{{- $creds := default dict .Values.secrets }}
{{- $allEnv := merge $creds $config }}
{{- /*
  The frontend gates the Plugins UI on SANDBOX_MANAGER_URL (see
  spotflow-fe/src/pages/api/environment.ts), and its pod only gets env through
  this secret — the backend/worker deployments set the var on themselves, which
  the frontend never sees. Wire it in here so a sandbox-enabled deployment
  actually shows the Plugins section.
*/ -}}
{{- if and .Values.sandbox .Values.sandbox.enabled (not (index $allEnv "SANDBOX_MANAGER_URL")) }}
{{- $_ := set $allEnv "SANDBOX_MANAGER_URL" (printf "http://%s-sandbox:%v" (include "noxus-platform.fullname" .) (.Values.sandbox.service.port | int)) }}
{{- end }}
{{- if or .Values.pgbouncer.enabled .Values.pgbouncer.managed_externally }}
{{- $pgbouncerHost := include "noxus-platform.pgbouncerName" . }}
{{- if .Values.pgbouncer.managed_externally }}
{{- $pgbouncerHost = required "pgbouncer.hostname_override is required when pgbouncer.managed_externally=true" .Values.pgbouncer.hostname_override }}
{{- end }}
{{- $postgresqlUrlSecretName := required "pgbouncer.postgresqlUrlSecret.name is required when pgbouncer.enabled=true or pgbouncer.managed_externally=true" .Values.pgbouncer.postgresqlUrlSecret.name }}
{{- $sourceSecret := default dict (lookup "v1" "Secret" .Release.Namespace $postgresqlUrlSecretName) }}
{{- $_ := required (printf "Secret %q is required in namespace %q when pgbouncer.enabled=true or pgbouncer.managed_externally=true" $postgresqlUrlSecretName .Release.Namespace) (dig "metadata" "name" "" $sourceSecret) }}
{{- $sourceSecretData := default dict $sourceSecret.data }}
{{- $postgresURL := required (printf "Secret %q must contain key POSTGRESQL_URL" $postgresqlUrlSecretName) (get $sourceSecretData "POSTGRESQL_URL" | b64dec) }}
{{- $pgbouncerURL := required "POSTGRESQL_URL must include username/password before the host when PgBouncer is enabled or managed externally" (include "noxus-platform.postgresUrlWithHostPort" (dict "url" $postgresURL "host" $pgbouncerHost "port" (.Values.pgbouncer.port | int))) }}
{{- /* Per-tenant table roles are created at runtime, so pgbouncer's static
       userlist can't authenticate them — preserve the direct backend endpoint
       so those connections bypass the pooler. */}}
{{- $_ := set $allEnv "DIRECT_POSTGRESQL_URL" (default $postgresURL (index $allEnv "DIRECT_POSTGRESQL_URL")) }}
{{- $_ := set $allEnv "POSTGRESQL_URL" $pgbouncerURL }}
{{- $_ := set $allEnv "VECTOR_POSTGRESQL_URL" $pgbouncerURL }}
{{- $_ := set $allEnv "PROCRASTINATE_POSTGRESQL_URL" "" }}
{{- end }}
---
# app-env: used by backend, worker pools
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "noxus-platform.appEnvSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "noxus-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $allEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  BILLING_ENABLED: "false"
  CELERY_DEPLOYMENT: "worker"
---
# frontend-env: app-env + HOSTNAME=0.0.0.0
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "noxus-platform.frontendEnvSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "noxus-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $allEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.frontendExtraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  BILLING_ENABLED: "false"
---
# relay-env: app-env minus excluded keys (Slack credentials)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "noxus-platform.relayEnvSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "noxus-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $excludeKeys := .Values.relayExcludeKeys }}
  {{- range $key, $value := $allEnv }}
  {{- if not (has $key $excludeKeys) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  BILLING_ENABLED: "false"
  CELERY_DEPLOYMENT: "worker"
