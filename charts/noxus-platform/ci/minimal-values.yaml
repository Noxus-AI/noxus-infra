# Smallest input that must render. Exercises the default component set.
env:
  ADMIN_EMAIL: ci@example.com
  FRONTEND_URL: https://ci.example.com
  BACKEND_URL: https://api.ci.example.com

secrets:
  POSTGRESQL_URL: "postgres:pw@db:5432"
  VECTOR_POSTGRESQL_URL: "postgres:pw@db:5432"
