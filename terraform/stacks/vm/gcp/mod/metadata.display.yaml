apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: marketplace-tools-display
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Wordpress
    source:
      repo: https://github.com/GoogleCloudPlatform/marketplace-tools.git
      sourceType: git
      dir: /examples/terraform/wordpress
  ui:
    input:
      variables:
        admin_email:
          name: admin_email
          title: Admin Email
          regexValidation: ^[a-zA-Z0-9!#$%&\'*+\/=?^_`{|}~\.-]+@[a-zA-Z0-9](?:[a-zA-Z0-9]?[.-]?[a-zA-Z0-9]+)+[[a-zA-Z0-9]{1}$
          xGoogleProperty:
            type: ET_EMAIL_ADDRESS
        whitelabel_logo:
          name: whitelabel_logo
          title: The URL of a logo representing your brand
        domain:
          name: domain
          title: The domain name for SSL certificates and other configurations
        goog_cm_deployment_name:
          name: goog_cm_deployment_name
          title: Goog Cm Deployment Name
        machine_type:
          name: machine_type
          title: Machine type
          xGoogleProperty:
            type: ET_GCE_MACHINE_TYPE
            zoneProperty: zone
        project_id:
          name: project_id
          title: Project Id
          invisible: true
        source_image:
          name: source_image
          title: Source Image
          invisible: true
          xGoogleProperty:
            type: ET_GCE_DISK_IMAGE
        region:
          name: region
          title: Region
          xGoogleProperty:
            type: ET_GCE_REGION
        zone:
          name: zone
          title: Zone
          xGoogleProperty:
            type: ET_GCE_ZONE
      sections:
        - name: admin_email
          title: Configuration
